[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poise-rl"
version = "0.1.0"
description = "POISE: Policy Optimization with Internal State Value Estimation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "torch==2.8.0", "numpy==1.26.4", "scikit-learn==1.9.0", "joblib==1.5.3",
  "transformers==4.57.1", "tokenizers==0.22.1", "ray[default,cgraph]==2.56.1",
  "tensordict==0.9.1", "torchdata==0.11.0", "hydra-core==1.3.4",
  "accelerate", "codetiming", "datasets", "dill", "pandas", "peft",
  "pyarrow>=19", "packaging", "psutil", "requests", "tqdm",
  "huggingface-hub", "setproctitle", "pylatexenc", "langdetect",
  "immutabledict", "nltk", "polars", "openai", "wandb==0.19.11", "math-verify==0.9.0",
  "latex2sympy2_extended==1.11.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2605.07579"
Homepage = "https://holi-lab.github.io/POISE/"
Repository = "https://github.com/holi-lab/POISE"

[project.optional-dependencies]
train = ["vllm==0.11.0"]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
poise-train = "poise.main:main"
poise-eval = "poise.eval:main"

[tool.setuptools]
package-dir = {"" = "src", "verl" = "vendor/verl"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "vendor"]
include = ["poise*", "verl*"]
namespaces = true

[tool.setuptools.package-data]
poise = ["config/*.yaml", "config/*.json"]
verl = ["py.typed", "version/version", "trainer/config/**/*.yaml", "trainer/config/*.yaml", "utils/reward_score/**/*.json", "utils/reward_score/**/*.txt", "utils/dataset/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
